<!doctype html>
<html lang="en-US">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Offline</title>

  <!--
    The last resort, served by the service worker when there is no network AND
    no cached app shell to fall back to — a first launch on a dead connection.

    Deliberately UNBRANDED. Every other user-visible string in this product
    comes from the BRAND_* configuration so a white-labelled instance never
    shows the vendor's name; this file is static, copied verbatim out of
    public/, and cannot read that configuration. Saying nothing is the only
    option here that is correct for every instance. The colours are the app's
    own tokens, hardcoded because a stylesheet is exactly the thing we do not
    have right now.

    Self-contained on purpose: no fonts, no scripts, no images. Anything
    fetched from here is a request that by definition cannot succeed.
  -->
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #141414;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #141414;
      --accent-fg: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --border: #2a2a2a;
        --accent: #fafafa;
        --accent-fg: #141414;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      /* dvh, not vh: on mobile Safari 100vh is taller than the visible area,
         which would push the retry button below the fold on the one screen
         whose entire purpose is that button. */
      min-height: 100dvh;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    main {
      width: 100%;
      max-width: 22rem;
      text-align: center;
    }

    .glyph {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 3.25rem;
      height: 3.25rem;
      margin: 0 auto 1.25rem;
      border: 1px solid var(--border);
      border-radius: 0.875rem;
      color: var(--muted);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    p {
      margin: 0;
      font-size: 0.875rem;
      line-height: 1.5;
      color: var(--muted);
    }

    button {
      margin-top: 1.5rem;
      /* 44px tall: this is a phone screen and it has exactly one control. */
      min-height: 2.75rem;
      width: 100%;
      border: 0;
      border-radius: 0.625rem;
      background: var(--accent);
      color: var(--accent-fg);
      font: inherit;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      opacity: 0.85;
    }

    .hint {
      margin-top: 0.875rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <main>
    <span class="glyph" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="m2 2 20 20" />
        <path d="M8.5 16.5a5 5 0 0 1 7 0" />
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
        <path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
        <path d="M12 20h.01" />
      </svg>
    </span>

    <h1>You&rsquo;re offline</h1>
    <p>
      This page needs a connection to load. Nothing you had already opened has
      been lost &mdash; it will be there when you&rsquo;re back.
    </p>

    <button type="button" onclick="location.reload()">Try again</button>

    <p class="hint">Reconnecting automatically as soon as you&rsquo;re online.</p>
  </main>

  <script>
    // Reload the moment the connection returns, so nobody sits on this page
    // staring at a button after their train leaves the tunnel.
    addEventListener('online', function () { location.reload(); });
  </script>
</body>

</html>
