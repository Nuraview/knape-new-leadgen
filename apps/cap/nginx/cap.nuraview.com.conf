server {
    listen 80;
    server_name cap.nuraview.com;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/cap_acme; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name cap.nuraview.com;

    ssl_certificate     /etc/letsencrypt/live/cap.nuraview.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cap.nuraview.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_vary on;

    # Recording uploads can be large; keep buffering off so multipart chunks
    # stream straight through to cap-web.
    client_max_body_size 512m;
    proxy_request_buffering off;

    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/cap_acme; default_type "text/plain"; }

    # Whole-video preview GIF sidecar (apps/cap/gifmaker). Secret-gated in the
    # app itself; ffmpeg runs can take a while on long videos.
    location /gifmaker/ {
        # aaPanel's global proxy.conf enables proxy_cache for ALL vhosts —
        # it served stale GIFs after sidecar rebuilds. Never cache here.
        proxy_cache off;
        proxy_no_cache 1;
        # /dl/<id>.mp4 streams large videos — don't buffer to disk, allow slow
        # client downloads to run long.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_pass http://127.0.0.1:3457/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        # aaPanel's global proxy.conf enables proxy_cache for ALL vhosts.
        # Cap's share-page/player APIs return transient state (processing,
        # signed URLs with ~1h expiry) — caching them makes "video not ready"
        # errors stick after the upload completes. Never cache app responses.
        proxy_cache off;
        proxy_no_cache 1;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Websocket upgrade ($connection_upgrade map lives in 0.websocket.conf)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
