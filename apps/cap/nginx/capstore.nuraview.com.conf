server {
    listen 80;
    server_name capstore.nuraview.com;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/capstore_acme; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name capstore.nuraview.com;

    ssl_certificate     /etc/letsencrypt/live/capstore.nuraview.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capstore.nuraview.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # S3 (MinIO) proxy. NO path rewriting — SigV4 signatures cover host+path.
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_buffering off;

    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/capstore_acme; default_type "text/plain"; }

    location / {
        # Never cache: presigned S3 URLs are per-request; aaPanel's global
        # proxy_cache could pin stale/expired-signature responses.
        proxy_cache off;
        proxy_no_cache 1;
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
