# Self-hosted Cap (github.com/CapSoftware/Cap) — Loom replacement.
# Derived from upstream docker-compose.coolify.yml (prebuilt images, Cap runs
# UNMODIFIED — AGPL compliance depends on that; never patch these images).
# All secrets are required (no insecure upstream fallbacks). Ports bind to
# loopback only; the aaPanel nginx on the host terminates TLS:
#   cap.nuraview.com      -> 127.0.0.1:3000  (cap-web)
#   capstore.nuraview.com -> 127.0.0.1:9000  (minio, path-style S3)
name: cap

services:
  cap-web:
    container_name: cap-web
    image: ghcr.io/capsoftware/cap-web:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://cap:${MYSQL_PASSWORD:?}@mysql:3306/cap
      WEB_URL: ${CAP_URL:?}
      NEXTAUTH_URL: ${CAP_URL:?}
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY:?}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?}
      MEDIA_SERVER_WEBHOOK_SECRET: ${MEDIA_SERVER_WEBHOOK_SECRET:?}
      CAP_AWS_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      CAP_AWS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      CAP_AWS_BUCKET: cap
      CAP_AWS_REGION: us-east-1
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_URL:?}
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_PATH_STYLE: "true"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_DOMAIN: ${RESEND_FROM_DOMAIN:-}
      # Lock signups: only these email domains may create NEW accounts.
      # Existing users always keep sign-in (checked in Cap's signIn callback).
      CAP_ALLOWED_SIGNUP_DOMAINS: ${CAP_ALLOWED_SIGNUP_DOMAINS:-}
      # Deepgram key: enables the Transcript tab + AI Summary + chapters.
      # Empty = transcription silently skipped ("No transcript available").
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      MEDIA_SERVER_URL: http://media-server:3456
      MEDIA_SERVER_WEBHOOK_URL: http://cap-web:3000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cap-network

  media-server:
    container_name: cap-media-server
    image: ghcr.io/capsoftware/cap-media-server:latest
    restart: unless-stopped
    # FFmpeg transcodes spike RAM; fence so a long 4K video can't starve the
    # other services on this box (inngest, whatsapp, scraper, n8n).
    mem_limit: 3g
    environment:
      PORT: 3456
      MEDIA_SERVER_WEBHOOK_SECRET: ${MEDIA_SERVER_WEBHOOK_SECRET:?}
    # No healthcheck: the prebuilt image ships neither wget nor curl (upstream's
    # check only fits their locally-built variant). The server logs "Starting on
    # port 3456" and cap-web retries webhooks, so a check adds nothing here.
    networks:
      - cap-network

  # OUR sidecar (not Cap code): Loom-style whole-video preview GIFs for email
  # embeds. Cap's own preview covers only the first ~4s and looks static for
  # screen recordings. apps/web calls this via nginx /gifmaker/ on the cap host.
  gifmaker:
    container_name: cap-gifmaker
    build: ./gifmaker
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      GIFMAKER_SECRET: ${GIFMAKER_SECRET:?}
    ports:
      - "127.0.0.1:3457:8080"
    networks:
      - cap-network

  mysql:
    container_name: cap-mysql
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cap
      MYSQL_USER: cap
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    command:
      - --max_connections=1000
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - cap-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "cap", "-p${MYSQL_PASSWORD:?}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cap-network

  minio:
    container_name: cap-minio
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - cap-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cap-network

  minio-setup:
    container_name: cap-minio-setup
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set capminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb capminio/cap --ignore-existing;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    networks:
      - cap-network

volumes:
  cap-mysql-data:
  cap-minio-data:

networks:
  cap-network:
    driver: bridge
