# crmx1.nuraview.com — CUTOVER: the new Hono + Vite stack serves this hostname.
#
# The old container (nuraview-crm on :3005) STAYS RUNNING and keeps serving the
# handful of paths that are not ported yet. Those are not optional niceties —
# they are URLs already sitting in other people's inboxes and in third-party
# consoles, and a 404 on any of them is visible to a client, not to us:
#
#   /proposal/*          the public share page clients open and SIGN. 17 live
#                        proposals, 7 viewed, 5 approved. Links are already out.
#   /api/proposals/*     approve / reject / paypal / asset — the buttons on that
#                        page, plus the PDF and upload-url endpoints.
#   /api/inngest         24 background functions. The new API emits events but
#                        has no handler to consume them yet.
#   /api/webhooks/*      Resend delivery/bounce events and the Stripe webhook,
#                        both configured by URL in a third-party dashboard.
#   /api/campaigns/*     includes /unsubscribe, which is in delivered mail.
#                        Breaking an unsubscribe link is a compliance problem,
#                        not a UX one.
#   /api/upload/*        general presigned uploads (the new API only has a
#                        task-scoped one).
#   /api/videos/*        Cap embed at its legacy path. The new stack exposes the
#                        same thing at /api/marketing/video-embed; this keeps
#                        the old path answering for anything still calling it.
#   /api/crm/*  /api/admin/*  /api/invoices/*  /api/reports/*  /api/og
#                        archived by decision — not ported, still reachable.
#
# ORDERING: `^~` prefix matches beat regex locations outright, and among prefix
# matches nginx picks the LONGEST, not the first. So `^~ /api/proposals/` wins
# over `^~ /api/` regardless of the order they appear in. The order below is for
# humans.
#
# ROLLBACK is one line: change the two `location /` and `location /api/`
# proxy_pass ports back to 3005 and reload. The old container never stopped.

# NOTE: $connection_upgrade is already mapped globally, in both
# /www/server/nginx/conf/nginx.conf and 0.websocket.conf. Declaring it again
# here is a duplicate map and nginx refuses to start.

server {
    listen 80;
    server_name crmx1.nuraview.com;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/crmx1_acme; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name crmx1.nuraview.com;

    ssl_certificate     /etc/letsencrypt/live/crmx1.nuraview.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crmx1.nuraview.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100m;

    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/crmx1_acme; default_type "text/plain"; }

    # MinIO. The SigV4 signature covers https://<host>/nuraview-crm/<key>, so
    # this location must mirror that path exactly — a trailing slash on
    # proxy_pass rewrites the URI and the signature stops matching.
    location /nuraview-crm/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /files/ {
        proxy_pass http://127.0.0.1:9000/nuraview-crm/;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-request-id;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---- still served by the legacy app (:3005) ----------------------------
    # The public proposal page is still served by the legacy Next app, and a
    # Next page is useless without its own build assets. /proposal/ was proxied
    # but /_next/ was NOT, so every chunk fell through to `location /` — the
    # SPA, which answers index.html for ANY path. The browser then parsed HTML
    # as JavaScript: "Uncaught SyntaxError: Unexpected token '<'", and the page
    # sat on skeletons forever. Same story for the Next manifest.
    #
    # These come OUT when the public proposal page is ported (Phase E); until
    # then the client-facing link depends on them.
    # /proposal/ and /_next/ USED to go to the legacy Next app. The client-facing
    # proposal page is now a route in the SPA (routes/proposal.$number.$slug),
    # backed by /api/proposal-public — so both fall through to `location /`
    # below and Next.js serves nothing on this host any more.
    #
    # The URL SHAPE is unchanged on purpose: /proposal/:number/:slug?t=<token>
    # is in clients' inboxes and every one of those links still resolves.
    location ^~ /api/inngest        { include /www/server/panel/vhost/nginx/nv_legacy.inc; }

    # ---- the new stack ------------------------------------------------------

    # WebSockets MUST come before `location /api/`: that block matches first
    # otherwise and does not set the Upgrade/Connection headers, which is how
    # every socket on the new stack failed silently once already.
    location ^~ /api/ws {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        # aaPanel turns proxy_cache on globally; this serves per-session data.
        proxy_cache off;
        proxy_no_cache 1;
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # The SPA.
    location / {
        proxy_cache off;
        proxy_no_cache 1;
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
