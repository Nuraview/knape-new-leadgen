# crmx2.nuraview.com — the new NuraView stack (Hono API + Vite SPA).
#
# Runs ALONGSIDE crmx1.nuraview.com, which keeps serving the legacy Next app.
# Nothing here touches crmx1: separate server block, separate upstreams,
# separate certificate.
#
#   127.0.0.1:3011  nuraview-api   (Hono)
#   127.0.0.1:3012  nuraview-app   (nginx serving the SPA bundle)
#
# /api is routed to the API container directly rather than proxied by the SPA
# container, so the browser talks to one origin and there are no CORS
# preflights in production.

server {
    listen 80;
    server_name crmx2.nuraview.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/crmx2_acme;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name crmx2.nuraview.com;

    ssl_certificate     /etc/letsencrypt/live/crmx2.nuraview.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crmx2.nuraview.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types application/json text/plain text/css application/javascript application/wasm;
    gzip_vary on;

    client_max_body_size 100m;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/crmx2_acme;
        default_type "text/plain";
    }

    # Object storage. Presigned URLs are signed against S3_ENDPOINT, so that
    # endpoint has to be the address the BROWSER uses — an internal Docker
    # hostname like cap-minio:9000 signs fine and then fails to resolve in the
    # client. nginx forwards this public path to MinIO so the signature stays
    # valid end to end. Mirrors how crmx1 exposes /files/.
    # NOTE the missing trailing slash on proxy_pass: the path must reach MinIO
    # BYTE-FOR-BYTE as signed. Proxying /files/ to ".../9000/" rewrote the path
    # and every presigned PUT came back 403, because SigV4 covers the path.
    # Exposing the bucket prefix at the root keeps signed and received paths
    # identical.
    location /nuraview-crm/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_request_buffering off;
        client_max_body_size 200m;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
    }

    # WebSockets. MUST come before `location /api/`.
    #
    # The client connects to /api/ws/<channel>, not /ws — so the /api/ block
    # below was matching, and it does not set the Upgrade/Connection headers.
    # nginx forwarded the handshake as an ordinary HTTP request and every socket
    # failed, which the browser retried forever ("WebSocket connection failed",
    # once per component per reconnect). Live board and task updates were dead.
    #
    # ^~ so this prefix wins outright and no regex location is considered.
    location ^~ /api/ws {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Long-lived: a board left open all day must not be cut every minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API. Same origin as the SPA, so no preflight round trip per request.
    location /api/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Bare /ws — kept for any client that connects without the /api prefix.
    location /ws {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA. The container itself handles the history fallback, so a deep link
    # like /leads/kanban survives a refresh.
    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
