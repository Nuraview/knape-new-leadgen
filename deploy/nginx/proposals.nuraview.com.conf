# Client-facing hosts for proposals and payment (meeting 2026-07-30).
#
# VK: a proposal link handed to a client must read proposals.nuraview.com, and
# the payment step invoices.nuraview.com — never crmx1.nuraview.com, which is a
# staff tool and looks like one. Both hosts serve the SAME SPA and API as
# crmx1; the distinction is the address bar, plus app logic that copies links
# with the proposals host and hops to the invoice host at pay time.
#
# ONE file for both server_names on purpose: they must never drift apart, and
# the only difference between them is the certificate.
#
# DNS (Cloudflare, user action):
#   proposals.nuraview.com  A  185.245.182.175   (currently CNAMEs to Vercel!)
#   invoices.nuraview.com    A  185.245.182.175   (does not exist yet)
#
# Certificates (run AFTER the DNS records point here):
#   certbot certonly --webroot -w /www/wwwroot/crmx1_acme \
#     -d proposals.nuraview.com -d invoices.nuraview.com \
#     --cert-name proposals.nuraview.com
#   then: nginx -s reload
#
# Until the cert exists, the 443 block below would stop nginx from starting —
# which is why deploy copies this file in DISABLED form (.conf.off) and the
# setup script renames it once certbot has run. See
# deploy/setup-proposal-domains.sh.

server {
    listen 80;
    server_name proposals.nuraview.com invoices.nuraview.com;
    # Same ACME webroot the crmx1 cert renews through.
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/crmx1_acme; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name proposals.nuraview.com invoices.nuraview.com;

    ssl_certificate     /etc/letsencrypt/live/proposals.nuraview.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proposals.nuraview.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/crmx1_acme; default_type "text/plain"; }

    # A client holding a proposal link needs exactly two things: the public
    # proposal page and its API. Everything else on these hosts bounces to the
    # proposal-shaped root so a curious client never sees a staff login.
    location /api/ {
        proxy_cache off;
        proxy_no_cache 1;
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The SPA (serves /proposal/:number/:slug).
    location / {
        proxy_cache off;
        proxy_no_cache 1;
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
