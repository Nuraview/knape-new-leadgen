name: CI

# Until this file existed, nothing in the repo ran a single test: the three
# other workflows only deploy. Combined with `typescript.ignoreBuildErrors`,
# ~140k LOC shipped with no automated verification of any kind.
#
# This is the gate for the Hono/Vite migration. Do not disable it to get a
# deploy out — roll back instead.

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      # bun.lock is authoritative — it is what apps/web/Dockerfile installs from.
      - run: bun install --frozen-lockfile

      # 34 suites / 174 tests. __tests__/invoices/lifecycle.test.ts is an
      # integration suite and self-skips unless TEST_DATABASE_URL is set.
      #
      # DATABASE_URL is a PLACEHOLDER and is deliberately unroutable. lib/db/env.ts
      # throws at import time when it is unset, which took five suites down before
      # a single test ran — not a failure, just a module that would not load, and
      # a red CI on every commit that people stop reading.
      #
      # Nothing here connects: the one suite that would talks to TEST_DATABASE_URL
      # and self-skips without it. If a test ever does open a socket, this host
      # refuses it loudly, which is the outcome we want over a silent connection
      # to something real.
      - name: jest
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci_placeholder
        run: bunx jest --ci --silent

  quality:
    name: typecheck + lint (ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - run: bun install --frozen-lockfile

      # Fails only if error counts rise above .ci-baseline.json.
      - name: ratchet
        run: bash scripts/ci-ratchet.sh

  build:
    name: next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - run: bun install --frozen-lockfile

      # Mirrors the Dockerfile's build stage: server-only vars are stubbed so
      # the build never needs real credentials.
      - name: build
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: postgres://stub:stub@localhost:5432/stub
          AUTH_SECRET: stub-secret-for-build-only
        run: bunx next build
